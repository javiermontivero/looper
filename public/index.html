<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111410"><title>Looper</title><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./style.css"><script type="module" src="./app.js"></script></head>
<body><main>
<header><label class="sr-only" for="sound">Sonido</label><select id="sound" aria-label="Sonido"></select><button id="power" title="Activar audio y conectar MIDI" aria-label="Activar audio y conectar MIDI">Activar</button><button id="settings-open" class="icon" aria-label="Ajustes" title="Ajustes">⚙</button></header>
<p id="notice" role="status" aria-live="polite" hidden></p>
<progress id="loop-progress" max="1" value="0" aria-label="Posición del loop"></progress>
<section class="tracks" aria-label="Pistas">
<article class="track" id="track-0" aria-label="Pista 1"><div class="track-main"><span class="number">01</span><span class="track-state"></span><button class="record" data-loop-action="record" data-track="0" aria-label="Grabar o cerrar pista 1" aria-pressed="false">Grabar</button><button class="mute icon" data-loop-action="mute" data-track="0" aria-label="Encender o apagar pista 1" disabled>▶</button><details><summary aria-label="Opciones de pista 1">⋯</summary><div class="track-menu"><button data-learn="track0">Asignar MIDI</button><button data-loop-action="clear" data-track="0" disabled>Borrar</button></div></details></div></article>
<article class="track" id="track-1" aria-label="Pista 2"><div class="track-main"><span class="number">02</span><span class="track-state"></span><button class="record" data-loop-action="record" data-track="1" aria-label="Grabar o cerrar pista 2" aria-pressed="false">Grabar</button><button class="mute icon" data-loop-action="mute" data-track="1" aria-label="Encender o apagar pista 2" disabled>▶</button><details><summary aria-label="Opciones de pista 2">⋯</summary><div class="track-menu"><button data-learn="track1">Asignar MIDI</button><button data-loop-action="clear" data-track="1" disabled>Borrar</button></div></details></div></article>
<article class="track" id="track-2" aria-label="Pista 3"><div class="track-main"><span class="number">03</span><span class="track-state"></span><button class="record" data-loop-action="record" data-track="2" aria-label="Grabar o cerrar pista 3" aria-pressed="false">Grabar</button><button class="mute icon" data-loop-action="mute" data-track="2" aria-label="Encender o apagar pista 3" disabled>▶</button><details><summary aria-label="Opciones de pista 3">⋯</summary><div class="track-menu"><button data-learn="track2">Asignar MIDI</button><button data-loop-action="clear" data-track="2" disabled>Borrar</button></div></details></div></article>
<article class="track" id="track-3" aria-label="Pista 4"><div class="track-main"><span class="number">04</span><span class="track-state"></span><button class="record" data-loop-action="record" data-track="3" aria-label="Grabar o cerrar pista 4" aria-pressed="false">Grabar</button><button class="mute icon" data-loop-action="mute" data-track="3" aria-label="Encender o apagar pista 4" disabled>▶</button><details><summary aria-label="Opciones de pista 4">⋯</summary><div class="track-menu"><button data-learn="track3">Asignar MIDI</button><button data-loop-action="clear" data-track="3" disabled>Borrar</button></div></details></div></article>
<article class="track" id="track-4" aria-label="Pista 5"><div class="track-main"><span class="number">05</span><span class="track-state"></span><button class="record" data-loop-action="record" data-track="4" aria-label="Grabar o cerrar pista 5" aria-pressed="false">Grabar</button><button class="mute icon" data-loop-action="mute" data-track="4" aria-label="Encender o apagar pista 5" disabled>▶</button><details><summary aria-label="Opciones de pista 5">⋯</summary><div class="track-menu"><button data-learn="track4">Asignar MIDI</button><button data-loop-action="clear" data-track="4" disabled>Borrar</button></div></details></div></article>
</section><div class="transport"><button id="loop-transport" disabled>Pausar</button><button id="loop-reset" disabled>Nueva sesión</button></div>
<dialog id="settings"><div class="dialog-head"><h2>Ajustes</h2><button id="settings-close" class="icon" aria-label="Cerrar ajustes">×</button></div><label for="midi-input">Teclado MIDI</label><select id="midi-input"><option value="">Sin teclado</option></select><p id="midi-status" role="status"></p><button id="connect">Conectar</button>
<label for="volume">Volumen <output id="volume-value">65%</output></label><input id="volume" type="range" min="0" max="100" value="65"><button data-learn="volume">Asignar MIDI</button>
<div class="mapping"><span>Sonido anterior</span><button data-learn="previous">Asignar MIDI</button></div><div class="mapping"><span>Sonido siguiente</span><button data-learn="next">Asignar MIDI</button></div><p id="learn-status" role="status"></p><button id="clear-mappings">Borrar asignaciones</button><button id="panic">Silenciar todo</button>
<p class="hint">Los loops se pierden al cerrar o recargar. Máximo 60 s.</p>
<details id="performance-details"><summary>Rendimiento</summary><pre id="performance-readout"></pre><button id="refresh-performance">Actualizar</button></details>
</dialog></main></body></html>
